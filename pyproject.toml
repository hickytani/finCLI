[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard"
version = "0.1.0"
description = "CLI-first transaction security runtime and adversarial research laboratory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "FIN//GUARD Contributors"},
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=42.0.0",
    "PyNaCl>=1.5.0",
    "argon2-cffi>=23.1.0",
    "networkx>=3.2.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
finguard = "finguard.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["finguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "security: marks tests as security tests",
    "attack: marks tests as attack simulation tests",
    "property: marks tests as property-based tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
